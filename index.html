<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#8f0b38">
  <meta name="description" content="Una frase diferente de motivación en cada visita.">
  <title>Conecta con tu cliente | UTEC</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main class="app">
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>

    <section class="card">
      <div class="brand">
        <div class="logo-placeholder">UTEC</div>
        <span>CAPACITACIÓN</span>
      </div>

      <p class="eyebrow">CONECTA CON TU CLIENTE</p>

      <div class="quote-mark">“</div>

      <div class="quote-area">
        <p id="frase" class="quote">Cargando una frase...</p>
        <p id="categoria" class="category"></p>
      </div>

      <button id="nuevaFrase" class="button">
        ✨ Otra frase
      </button>

      <div class="divider"></div>

      <p class="footer-text">Una frase diferente puede cambiar tu perspectiva.</p>
      <p class="footer-brand">Universidad Tecnológica de El Salvador</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
